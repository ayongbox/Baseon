# Baseon 告警规则模板（Prometheus Rule 格式，可直接被 Prometheus rule_files 加载）。
#
# 指标来源：Spring Boot Actuator + Micrometer（micrometer-registry-prometheus）。
# 阈值按中等规模服务设定，接入后按业务 SLO 调整；所有规则只依赖 Boot 标准指标，
# 唯一自定义指标是 baseon-starter-mybatis-plus 的慢 SQL 计数。
#
# 前置条件：
#   1. management.endpoints.web.exposure.include 包含 prometheus；
#   2. /actuator/prometheus 未被认证拦截，抓取成功（up=1）；
#   3. 慢 SQL 指标需引入 micrometer-registry-prometheus（否则规则永远无数据，P-032）。

groups:
  - name: baseon-availability
    interval: 30s
    rules:
      - alert: BaseonServiceDown
        expr: 'up{job="baseon-services"} == 0'
        for: 2m
        labels:
          severity: critical
          component: availability
        annotations:
          summary: "服务 {{ $labels.application }} 抓取失败"
          description: "实例 {{ $labels.instance }} 连续 2 分钟抓取失败。先检查进程/端口，再确认 /actuator/prometheus 是否被认证拦截（P-031/P-032）。"

  - name: baseon-http
    interval: 30s
    rules:
      - alert: BaseonHighErrorRate
        expr: 'sum by (application, job) (rate(http_server_requests_seconds_count{job="baseon-services",status=~"5.."}[5m])) / clamp_min(sum by (application, job) (rate(http_server_requests_seconds_count{job="baseon-services"}[5m])), 0.001) > 0.05'
        for: 10m
        labels:
          severity: warning
          component: http
        annotations:
          summary: "服务 {{ $labels.application }} 5xx 比例超过 5%"
          description: "最近 5 分钟 5xx 占比 {{ $value | humanizePercentage }}。查看全局异常日志与下游依赖状态。"

      - alert: BaseonHighLatencyP95
        expr: 'histogram_quantile(0.95, sum by (le, application, uri) (rate(http_server_requests_seconds_bucket{job="baseon-services",uri!~"/actuator.*"}[5m]))) > 1'
        for: 10m
        labels:
          severity: warning
          component: http
        annotations:
          summary: "服务 {{ $labels.application }} 接口 {{ $labels.uri }} P95 超过 1s"
          description: "P95 当前 {{ $value }}s。先看慢 SQL 与下游 Feign/熔断指标，再排查 GC。"

  - name: baseon-jvm
    interval: 30s
    rules:
      - alert: BaseonHeapUsageHigh
        expr: 'sum by (application) (jvm_memory_used_bytes{job="baseon-services",area="heap"}) / clamp_min(sum by (application) (jvm_memory_max_bytes{job="baseon-services",area="heap"}), 1) > 0.85'
        for: 10m
        labels:
          severity: warning
          component: jvm
        annotations:
          summary: "服务 {{ $labels.application }} 堆使用率超过 85%"
          description: "堆使用率 {{ $value | humanizePercentage }}。确认 MaxRAMPercentage 与容器 memory limit 匹配（P-030），并排查内存泄漏。"

      - alert: BaseonGcPauseHigh
        expr: 'sum by (application) (rate(jvm_gc_pause_seconds_sum{job="baseon-services"}[5m])) / clamp_min(sum by (application) (rate(jvm_gc_pause_seconds_count{job="baseon-services"}[5m])), 0.001) > 0.2'
        for: 10m
        labels:
          severity: warning
          component: jvm
        annotations:
          summary: "服务 {{ $labels.application }} 平均 GC 停顿超过 200ms"
          description: "平均停顿 {{ $value }}s。检查堆大小、晋升失败与 G1 参数，必要时开启 GC 日志。"

  - name: baseon-datasource
    interval: 30s
    rules:
      - alert: BaseonHikariPendingHigh
        expr: 'sum by (application, pool) (hikaricp_connections_pending{job="baseon-services"}) > 5'
        for: 5m
        labels:
          severity: warning
          component: datasource
        annotations:
          summary: "服务 {{ $labels.application }} 连接池 {{ $labels.pool }} 等待线程超过 5"
          description: "存在 {{ $value }} 个线程等待连接。检查慢 SQL、连接池上限与数据库负载。"

      - alert: BaseonHikariTimeouts
        expr: 'sum by (application, pool) (increase(hikaricp_connections_timeout_total{job="baseon-services"}[5m])) > 0'
        for: 5m
        labels:
          severity: warning
          component: datasource
        annotations:
          summary: "服务 {{ $labels.application }} 连接池 {{ $labels.pool }} 出现获取连接超时"
          description: "5 分钟内新增 {{ $value }} 次超时。优先排查长事务与连接泄漏。"

      - alert: BaseonSlowSqlSpike
        expr: 'sum by (application, statement) (rate(baseon_mybatis_slowsql_total{job="baseon-services"}[5m])) > 0.2'
        for: 10m
        labels:
          severity: warning
          component: mybatis
        annotations:
          summary: "服务 {{ $labels.application }} 慢 SQL {{ $labels.statement }} 持续出现"
          description: "慢 SQL 速率 {{ $value }} 次/秒（阈值 baseon.mybatis-plus.slow-sql-threshold-ms 默认 1000ms）。检查执行计划与索引。"
