# Baseon GitLab CI 模板：依赖漏洞扫描 + 容器镜像扫描 + 清单配置扫描
#
# 引入方式（业务工程根 .gitlab-ci.yml）：
#   include:
#     - local: 'ci/security-scan.gitlab-ci.yml'
#
# 前提：
#   1. runner 允许拉取 docker 镜像，且工作目录可写；
#   2. 镜像扫描任务需要上游构建任务推送候选镜像，并设置 SECURITY_SCAN_IMAGE_REF；
#   3. 首次运行会下载 Trivy 漏洞库，耗时较长，已用 cache 缓存。
#
# 阈值默认只拦截 HIGH/CRITICAL；需要全量报告时把 TRIVY_SEVERITY 改为
# UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL，并保留 --exit-code 由流水线自行判断。

stages:
  - security

variables:
  TRIVY_IMAGE: aquasec/trivy:0.50.1
  TRIVY_CACHE_DIR: .trivy-cache
  TRIVY_SEVERITY: HIGH,CRITICAL
  SECURITY_SCAN_REPORT_DIR: reports/security
  # 待扫描镜像由上游任务产出，例如 registry.example.com/baseon/demo-service:${CI_COMMIT_SHA}
  SECURITY_SCAN_IMAGE_REF: ""
  # 仓库内 K8s 清单目录；不放置清单时配置扫描任务会被 exists 规则跳过
  SECURITY_SCAN_CONFIG_DIR: deploy/k8s

.dependency-scan-base:
  stage: security
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  cache:
    key: trivy-db
    paths:
      - .trivy-cache/
  before_script:
    - mkdir -p "$SECURITY_SCAN_REPORT_DIR"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/security/

# Maven 依赖漏洞：Trivy 直接解析 pom.xml，无需先执行 mvn dependency:tree
dependency-scan:
  extends: .dependency-scan-base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - >-
      trivy fs
      --scanners vuln
      --severity "$TRIVY_SEVERITY"
      --ignore-unfixed
      --skip-dirs target
      --skip-dirs .git
      --skip-dirs .trivy-cache
      --skip-dirs reports
      --format table
      .
    - >-
      trivy fs
      --scanners vuln
      --severity "$TRIVY_SEVERITY"
      --ignore-unfixed
      --skip-dirs target
      --skip-dirs .git
      --skip-dirs .trivy-cache
      --skip-dirs reports
      --format json
      --output "$SECURITY_SCAN_REPORT_DIR/dependency-scan.json"
      .
    - >-
      trivy fs
      --scanners vuln
      --severity "$TRIVY_SEVERITY"
      --ignore-unfixed
      --skip-dirs target
      --skip-dirs .git
      --skip-dirs .trivy-cache
      --skip-dirs reports
      --format cyclonedx
      --output "$SECURITY_SCAN_REPORT_DIR/sbom.cdx.json"
      .

# 容器镜像漏洞 + SBOM：只扫描已推送的不可变镜像标签，避免扫描本地缓存镜像
container-scan:
  extends: .dependency-scan-base
  # 不使用 needs: []：必须等上游构建任务推送镜像后再扫描
  rules:
    - if: '$SECURITY_SCAN_IMAGE_REF != "" && $CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$SECURITY_SCAN_IMAGE_REF != "" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$SECURITY_SCAN_IMAGE_REF != "" && $CI_COMMIT_TAG'
  script:
    - >-
      trivy image
      --scanners vuln
      --severity "$TRIVY_SEVERITY"
      --ignore-unfixed
      --format table
      "$SECURITY_SCAN_IMAGE_REF"
    - >-
      trivy image
      --scanners vuln
      --severity "$TRIVY_SEVERITY"
      --ignore-unfixed
      --format json
      --output "$SECURITY_SCAN_REPORT_DIR/image-scan.json"
      "$SECURITY_SCAN_IMAGE_REF"
    - >-
      trivy image
      --format cyclonedx
      --output "$SECURITY_SCAN_REPORT_DIR/image-sbom.cdx.json"
      "$SECURITY_SCAN_IMAGE_REF"

# K8s / Dockerfile / Compose 配置级风险：特权容器、缺失探针、latest 标签等
config-scan:
  extends: .dependency-scan-base
  rules:
    - exists:
        - deploy/k8s/*.yaml
        - deploy/k8s/*.yml
  script:
    - >-
      trivy config
      --severity "$TRIVY_SEVERITY"
      --format table
      "$SECURITY_SCAN_CONFIG_DIR"
    - >-
      trivy config
      --severity "$TRIVY_SEVERITY"
      --format json
      --output "$SECURITY_SCAN_REPORT_DIR/config-scan.json"
      "$SECURITY_SCAN_CONFIG_DIR"
