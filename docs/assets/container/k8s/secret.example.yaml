# 示例文件：不要直接提交真实值，也不要把本文件纳入自动化 apply。
#
# 推荐做法：
#   kubectl -n baseon create secret generic baseon-demo-service-secret \
#     --from-literal=BASEON_AUTH_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=BASEON_DATASOURCE_MASTER_PASSWORD='***' \
#     --from-literal=SPRING_CLOUD_NACOS_PASSWORD='***'
#
# 或使用 External Secrets / Vault / KMS 注入，仓库只保留本示例的结构。
apiVersion: v1
kind: Secret
metadata:
  name: baseon-demo-service-secret
  namespace: baseon
  labels:
    app.kubernetes.io/name: baseon-demo-service
    app.kubernetes.io/part-of: baseon
type: Opaque
stringData:
  # JWT 签名密钥：ASCII 且不少于 32 字节，baseon-starter-auth 启动时硬校验
  BASEON_AUTH_SECRET: "REPLACE_WITH_32_BYTES_MIN_SECRET"
  BASEON_DATASOURCE_MASTER_PASSWORD: "REPLACE_ME"
  BASEON_DATASOURCE_SLAVES_0_PASSWORD: "REPLACE_ME"
  SPRING_CLOUD_NACOS_PASSWORD: "REPLACE_ME"
