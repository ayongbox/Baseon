server:
  port: 8092

spring:
  application:
    name: demo-service-b
  cloud:
    nacos:
      server-addr: localhost:8848
      username: nacos
      password: nacos
  # nacos starter 含配置中心能力，optional 前缀表示配置不存在也能启动
  config:
    import:
      - optional:nacos:demo-service-b.yaml

logging:
  level:
    # 仅本地验证：demo 包整体 DEBUG，生产环境务必删除本段或调至 INFO。
    # 框架 starter 包保持默认 INFO。
    io.github.ayongbox.baseon.demo: debug
