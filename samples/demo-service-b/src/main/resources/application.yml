server:
  port: 8092

spring:
  application:
    name: demo-service-b
  cloud:
    nacos:
      server-addr: localhost:8848
      username: nacos
      password: nacos
      discovery:
        # 本地联调固定注册回环地址：多网卡环境下 Nacos 默认选取的局域网 IP
        # 可能随网络切换失效，导致调用方拿到不可达地址（502/超时）。
        # 仅本地验证使用，生产部署必须删除本段，让框架自动选路。
        ip: 127.0.0.1
  # nacos starter 含配置中心能力，optional 前缀表示配置不存在也能启动
  config:
    import:
      - optional:nacos:demo-service-b.yaml

# 7 期：网关聚合文档——本服务只保留 /v3/api-docs 端点供网关拉取，UI 收敛到网关（8090）
baseon:
  swagger:
    title: Demo Service B API
    description: 下游演示服务接口文档（经网关聚合展示）
    version: 1.0.0-SNAPSHOT

# 7 期：Swagger 网关聚合场景，业务服务只保留 /v3/api-docs 端点供网关拉取，
# UI 统一收敛到网关（demo-gateway:8090），本服务不再单独暴露 swagger-ui
springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    # 仅本地验证：demo 包整体 DEBUG，生产环境务必删除本段或调至 INFO。
    # 框架 starter 包保持默认 INFO。
    io.github.ayongbox.baseon.demo: debug
